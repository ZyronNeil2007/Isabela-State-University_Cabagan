<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=./web/">
    <title>ISU Premium ID Generator — Isabela State University</title>
    <script>
        // Preserve any query parameters and hash fragments during redirect
        const target = './web/' + window.location.search + window.location.hash;
        window.location.replace(target);
    </script>
    <style>
        :root {
            --bg: #031206;
            --green: #15803d;
            --gold: #f59e0b;
            --text: #f0fdf4;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            padding: 2rem;
            max-width: 480px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(245, 158, 11, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 0.5rem;
            color: #ffffff;
        }
        p {
            font-size: 0.9rem;
            color: #86efac;
            margin: 0 0 1.5rem;
        }
        a {
            display: inline-block;
            padding: 0.6rem 1.4rem;
            background: linear-gradient(135deg, #15803d, #166534);
            color: #ffffff;
            text-decoration: none;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.875rem;
            border: 1px solid rgba(245, 158, 11, 0.4);
            transition: opacity 0.2s;
        }
        a:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Redirecting to ISU Premium ID Generator</h1>
        <p>Taking you to the web application...</p>
        <p><a href="./web/">Click here if you are not redirected automatically</a></p>
    </div>
</body>
</html>
